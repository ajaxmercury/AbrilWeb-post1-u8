<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; font-size: 0.9em; }
        .btn { padding: 8px 15px; text-decoration: none; border-radius: 4px; color: white; display: inline-block; border: none; cursor: pointer; }
        .btn-primary { background-color: #007bff; }
        .btn-secondary { background-color: #6c757d; }
    </style>
</head>
<body>
    <h1 th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}">Formulario</h1>
    
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" style="max-width: 500px;">
        <input type="hidden" th:field="*{id}" />
        
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" />
            <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></div>
        </div>

        <div class="form-group">
            <label for="precio">Precio:</label>
            <input type="number" step="0.01" id="precio" th:field="*{precio}" />
            <div th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" class="error"></div>
        </div>

        <div class="form-group">
            <label for="stock">Stock:</label>
            <input type="number" id="stock" th:field="*{stock}" />
            <div th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" class="error"></div>
        </div>

        <div class="form-group">
            <label for="categoriaId">Categoría:</label>
            <select id="categoriaId" name="categoriaId" required>
                <option value="" disabled selected th:if="${producto.categoria == null}">Seleccione Categoría</option>
                <option th:each="cat : ${categorias}" 
                        th:value="${cat.id}" 
                        th:text="${cat.nombre}"
                        th:selected="${producto.categoria != null and producto.categoria.id == cat.id}"></option>
            </select>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</body>
</html>
