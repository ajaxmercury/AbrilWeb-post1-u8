<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Eliminación</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .alert { padding: 15px; background-color: #f8d7da; color: #721c24; margin-bottom: 20px; border: 1px solid #f5c6cb; border-radius: 4px; }
        .btn { padding: 8px 15px; text-decoration: none; border-radius: 4px; color: white; display: inline-block; border: none; cursor: pointer; }
        .btn-danger { background-color: #dc3545; }
        .btn-secondary { background-color: #6c757d; }
    </style>
</head>
<body>
    <h1>Confirmar Eliminación</h1>
    
    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <p>¿Estás seguro de que deseas eliminar la categoría <strong th:text="${categoria.nombre}"></strong>?</p>
    
    <form th:action="@{/categorias/eliminar/{id}(id=${categoria.id})}" method="post">
        <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
        <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
